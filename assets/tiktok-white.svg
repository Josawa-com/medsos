      <animate attributeName="opacity" values="0.18;0.45;0.18" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="13;17;13" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="13;17;13" dur="3s" repeatCount="indefinite"/>
    </ellipse>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3.5;0 0" dur="3s" repeatCount="indefinite"/>
      <g transform="translate(18 18) scale(1.1667)">
